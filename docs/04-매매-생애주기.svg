<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="a2r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="60" y="46" font-size="24" font-weight="700" fill="#0f172a">매매 생애주기 — 진입은 다음 개장 시가, 청산은 즉시 (둘 다 자동)</text>

  <!-- 진입 경로 -->
  <rect x="60" y="90" width="1160" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="82" y="118" font-size="15" font-weight="700" fill="#334155">진입 경로 — 자동 · 다음 개장 시가</text>

  <rect x="85" y="140" width="185" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="177" y="168" font-size="13.5" font-weight="600" fill="#0c4a6e" text-anchor="middle">공시 수신</text>
  <text x="177" y="188" font-size="11" fill="#0369a1" text-anchor="middle">ingested_at 기록</text>
  <text x="177" y="205" font-size="11" fill="#0369a1" text-anchor="middle">중복 정규화</text>

  <rect x="315" y="140" width="185" height="76" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="407" y="168" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle">워치리스트 대조</text>
  <text x="407" y="188" font-size="11" fill="#475569" text-anchor="middle">그날 스냅샷 기준</text>
  <text x="407" y="205" font-size="11" fill="#475569" text-anchor="middle">유동성 필터</text>

  <rect x="545" y="140" width="185" height="76" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="637" y="168" font-size="13.5" font-weight="600" fill="#701a75" text-anchor="middle">LLM 판단</text>
  <text x="637" y="188" font-size="11" fill="#86198f" text-anchor="middle">진입 여부 + 확신도</text>
  <text x="637" y="205" font-size="11" fill="#86198f" text-anchor="middle">청산조건 확정</text>

  <rect x="775" y="140" width="185" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="867" y="168" font-size="13.5" font-weight="600" fill="#14532d" text-anchor="middle">게이트</text>
  <text x="867" y="188" font-size="11" fill="#166534" text-anchor="middle">슬롯 · 쿨다운</text>
  <text x="867" y="205" font-size="11" fill="#166534" text-anchor="middle">최소 주문금액</text>

  <rect x="1005" y="140" width="185" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1097" y="168" font-size="13.5" font-weight="600" fill="#0c4a6e" text-anchor="middle">킬 스위치 확인</text>
  <text x="1097" y="188" font-size="11" fill="#0369a1" text-anchor="middle">걸려 있으면 진입 스킵</text>
  <text x="1097" y="205" font-size="11" fill="#0369a1" text-anchor="middle">사람 개입은 여기뿐</text>

  <rect x="545" y="240" width="415" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="752" y="265" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">다음 개장 시가 · 시장가 매수</text>
  <text x="752" y="286" font-size="11.5" fill="#b91c1c" text-anchor="middle">부분체결 시 가중평균가를 진입가로 확정</text>

  <line x1="270" y1="178" x2="309" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="500" y1="178" x2="539" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="730" y1="178" x2="769" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="960" y1="178" x2="999" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M1097,216 L1097,270 L966,270" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a2)"/>

  <!-- 보유 -->
  <rect x="60" y="350" width="1160" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="82" y="378" font-size="15" font-weight="700" fill="#334155">보유 · 청산 경로 — 완전 자동 · 장중 즉시 · LLM 재호출 없음</text>

  <rect x="85" y="400" width="230" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="200" y="428" font-size="13.5" font-weight="600" fill="#78350f" text-anchor="middle">분봉 종가마다 갱신</text>
  <text x="200" y="450" font-size="11" fill="#92400e" text-anchor="middle">최고가 추적 (재계산 가능)</text>
  <text x="200" y="468" font-size="11" fill="#92400e" text-anchor="middle">ATR 산출</text>

  <rect x="370" y="400" width="255" height="90" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="497" y="426" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">스톱 레벨 계산</text>
  <text x="497" y="448" font-size="11" fill="#334155" text-anchor="middle">+5% 미만 → 진입가 −5%</text>
  <text x="497" y="465" font-size="11" fill="#334155" text-anchor="middle">+5% 도달 → 진입가 (본전)</text>
  <text x="497" y="482" font-size="11" fill="#334155" text-anchor="middle">이후 → max(진입가, 최고가 − k·ATR)</text>

  <rect x="680" y="400" width="215" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="787" y="432" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle">발동 조건 확인</text>
  <text x="787" y="454" font-size="11" fill="#475569" text-anchor="middle">종가 &lt; 스톱 레벨</text>
  <text x="787" y="472" font-size="11" fill="#475569" text-anchor="middle">또는 최대 보유일 초과</text>

  <rect x="950" y="400" width="240" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1070" y="432" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">시장가 청산 (즉시)</text>
  <text x="1070" y="454" font-size="11" fill="#b91c1c" text-anchor="middle">킬 스위치와 무관하게 집행</text>
  <text x="1070" y="472" font-size="11" fill="#b91c1c" text-anchor="middle">텔레그램 사후 알림</text>

  <line x1="315" y1="445" x2="364" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="625" y1="445" x2="674" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="895" y1="445" x2="944" y2="445" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a2r)"/>
  <text x="920" y="435" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">Y</text>

  <path d="M787,490 L787,540 L200,540 L200,496" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <text x="500" y="558" font-size="11.5" fill="#475569" text-anchor="middle">N — 다음 분봉으로 (스톱은 하향되지 않음)</text>

  <path d="M752,300 L752,338 L200,338 L200,394" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a2)"/>

  <text x="60" y="648" font-size="12.5" fill="#64748b">· 최고가는 저장하지 않는다 — 진입 시각과 진입가만 있으면 분봉에서 재계산되므로 백업 대상에서 제외된다.</text>
  <text x="60" y="672" font-size="12.5" fill="#64748b">· 보유 중 LLM을 재호출하지 않는다 — 이벤트당 1회 호출로 고정해야 캐시가 성립하고 백테스트가 재현된다.</text>
  <text x="60" y="696" font-size="12.5" fill="#64748b">· 갭하락 시 스톱 레벨은 지켜지지 않는다 — 시가에 체결되며, 백테스트도 시가 체결로 모델링해야 한다.</text>
</svg>
