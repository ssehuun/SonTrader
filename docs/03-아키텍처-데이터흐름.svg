<svg viewBox="0 0 1360 1010" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="ahs" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <marker id="ahb" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1360" height="1010" fill="#ffffff"/>
  <text x="60" y="44" font-size="24" font-weight="700" fill="#0f172a">트레이딩 시스템 — 구조 및 데이터 흐름</text>
  <text x="60" y="66" font-size="13" fill="#64748b">실선 = 처리 흐름 · 점선 = 기록 / 캐시</text>

  <!-- Row A: 외부 -->
  <rect x="200" y="86" width="300" height="52" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="110" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">DART / KIND</text>
  <text x="350" y="128" font-size="12" fill="#64748b" text-anchor="middle">전종목 공시 (실적 공시 포함)</text>

  <rect x="620" y="86" width="300" height="52" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">KIS OpenAPI</text>
  <text x="770" y="128" font-size="12" fill="#64748b" text-anchor="middle">시세 · 잔고 · 주문</text>

  <!-- Row B: 수집 -->
  <rect x="200" y="192" width="300" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="350" y="216" font-size="15" font-weight="600" fill="#0c4a6e" text-anchor="middle">공시 수집기</text>
  <text x="350" y="235" font-size="12" fill="#0369a1" text-anchor="middle">이중 타임스탬프 · 중복 정규화</text>

  <rect x="620" y="192" width="300" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="770" y="216" font-size="15" font-weight="600" fill="#0c4a6e" text-anchor="middle">시세 수집기</text>
  <text x="770" y="235" font-size="12" fill="#0369a1" text-anchor="middle">1분봉 · 일봉</text>

  <rect x="1000" y="192" width="300" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1150" y="216" font-size="15" font-weight="600" fill="#0c4a6e" text-anchor="middle">유니버스 빌더 (모멘텀)</text>
  <text x="1150" y="235" font-size="12" fill="#0369a1" text-anchor="middle">일 1회 · 히스테리시스 50 / 70</text>

  <!-- Row C: 저장소 -->
  <rect x="90" y="310" width="1210" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="115" y="338" font-size="16" font-weight="700" fill="#78350f">저장소 (SQLite · WAL)</text>
  <text x="1275" y="338" font-size="12" fill="#92400e" text-anchor="end">append-only 원칙</text>

  <rect x="115" y="360" width="180" height="72" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="205" y="390" font-size="13" font-weight="600" fill="#78350f" text-anchor="middle">events</text>
  <text x="205" y="410" font-size="11" fill="#92400e" text-anchor="middle">published / ingested</text>

  <rect x="310" y="360" width="180" height="72" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="400" y="390" font-size="13" font-weight="600" fill="#78350f" text-anchor="middle">bars_1m · 1d</text>
  <text x="400" y="410" font-size="11" fill="#92400e" text-anchor="middle">시세 원본</text>

  <rect x="505" y="360" width="180" height="72" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="595" y="390" font-size="13" font-weight="600" fill="#78350f" text-anchor="middle">watchlist_snapshots</text>
  <text x="595" y="410" font-size="11" fill="#92400e" text-anchor="middle">point-in-time</text>

  <rect x="700" y="360" width="180" height="72" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="790" y="390" font-size="13" font-weight="600" fill="#78350f" text-anchor="middle">positions · orders</text>
  <text x="790" y="410" font-size="11" fill="#92400e" text-anchor="middle">fills · 멱등 키</text>

  <rect x="895" y="360" width="180" height="72" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="985" y="390" font-size="13" font-weight="600" fill="#78350f" text-anchor="middle">kill_switch</text>
  <text x="985" y="410" font-size="11" fill="#92400e" text-anchor="middle">전역 온/오프 단일 행</text>

  <rect x="1090" y="360" width="180" height="72" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="1180" y="390" font-size="13" font-weight="600" fill="#78350f" text-anchor="middle">llm_judgments</text>
  <text x="1180" y="410" font-size="11" fill="#92400e" text-anchor="middle">재현성의 핵심</text>

  <!-- Row D: 드라이버 -->
  <rect x="150" y="520" width="320" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="310" y="548" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">실전 루프 (클라우드 VM)</text>
  <text x="310" y="570" font-size="12" fill="#6d28d9" text-anchor="middle">RealClock · 1분 틱 · 상시 가동</text>

  <rect x="545" y="520" width="290" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="690" y="548" font-size="15" font-weight="600" fill="#0c4a6e" text-anchor="middle">텔레그램 봇</text>
  <text x="690" y="570" font-size="12" fill="#0369a1" text-anchor="middle">알림 · 킬 스위치 (매매 지시 아님)</text>

  <rect x="910" y="520" width="320" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1070" y="548" font-size="16" font-weight="700" fill="#4c1d95" text-anchor="middle">백테스트 러너 (로컬 PC)</text>
  <text x="1070" y="570" font-size="12" fill="#6d28d9" text-anchor="middle">ReplayClock · ingested_at 기준 재생</text>

  <!-- Row E: 공용 코어 -->
  <rect x="240" y="650" width="900" height="185" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="690" y="682" font-size="18" font-weight="700" fill="#14532d" text-anchor="middle">공용 코어 — 실전과 백테스트가 동일 코드를 실행</text>
  <text x="690" y="703" font-size="12" fill="#166534" text-anchor="middle">순수 함수 · 부작용 없음 · 시각과 데이터는 주입</text>

  <rect x="275" y="722" width="245" height="82" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="397" y="750" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">전략</text>
  <text x="397" y="770" font-size="11.5" fill="#166534" text-anchor="middle">청산 판정 + 진입 후보</text>
  <text x="397" y="788" font-size="11.5" fill="#166534" text-anchor="middle">→ 목표 포트폴리오</text>

  <rect x="560" y="722" width="250" height="82" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="750" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">게이트</text>
  <text x="685" y="770" font-size="11.5" fill="#166534" text-anchor="middle">5종목 · 쿨다운 · 최소금액</text>
  <text x="685" y="788" font-size="11.5" fill="#166534" text-anchor="middle">no-trade band · 킬 스위치</text>

  <rect x="850" y="722" width="255" height="82" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="977" y="750" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">diff → 주문</text>
  <text x="977" y="770" font-size="11.5" fill="#166534" text-anchor="middle">목표 − 현재 포지션</text>
  <text x="977" y="788" font-size="11.5" fill="#166534" text-anchor="middle">urgency: 즉시 / 다음 시가</text>

  <!-- LLM 판단 -->
  <rect x="45" y="722" width="165" height="82" rx="8" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="127" y="750" font-size="14" font-weight="700" fill="#701a75" text-anchor="middle">LLM 판단</text>
  <text x="127" y="770" font-size="11.5" fill="#86198f" text-anchor="middle">이벤트당 1회</text>
  <text x="127" y="788" font-size="11.5" fill="#86198f" text-anchor="middle">청산조건 확정</text>

  <!-- Row F: 집행 -->
  <rect x="240" y="900" width="370" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="425" y="928" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">KIS 브로커 (실전 집행)</text>
  <text x="425" y="950" font-size="11.5" fill="#b91c1c" text-anchor="middle">멱등 키 · 유량 제한 · 부분체결 · 잔고 대조</text>

  <rect x="770" y="900" width="370" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="955" y="928" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">시뮬 브로커 (백테스트)</text>
  <text x="955" y="950" font-size="11.5" fill="#b91c1c" text-anchor="middle">시가 체결 · 거래세 · 슬리피지 · D+2</text>

  <!-- 화살표: 외부 → 수집 -->
  <line x1="350" y1="138" x2="350" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="770" y1="138" x2="770" y2="186" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 수집 → 저장소 -->
  <line x1="350" y1="248" x2="350" y2="304" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="360" y="280" font-size="11.5" fill="#475569">공시 적재</text>
  <line x1="770" y1="248" x2="770" y2="304" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="780" y="280" font-size="11.5" fill="#475569">분봉 적재</text>
  <line x1="1150" y1="248" x2="1150" y2="304" stroke="#475569" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ahb)"/>
  <text x="1160" y="280" font-size="11.5" fill="#475569">일봉 조회 / 스냅샷 저장</text>

  <!-- 저장소 → 드라이버 -->
  <line x1="310" y1="460" x2="310" y2="514" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="320" y="492" font-size="11.5" fill="#475569">현재 시각까지의 데이터</text>
  <line x1="1070" y1="460" x2="1070" y2="514" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <text x="1080" y="492" font-size="11.5" fill="#475569">과거 구간 재생</text>

  <!-- 드라이버 → 코어 -->
  <line x1="310" y1="590" x2="345" y2="644" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="1070" y1="590" x2="1035" y2="644" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="690" y="628" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">서로 다른 어댑터를 주입 · 같은 루프 호출</text>

  <!-- 코어 내부 -->
  <line x1="520" y1="763" x2="554" y2="763" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="810" y1="763" x2="844" y2="763" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="210" y1="763" x2="269" y2="763" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- LLM 캐시 점선 -->
  <path d="M127,722 L127,466" stroke="#a21caf" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ahs)"/>
  <text x="137" y="640" font-size="11.5" fill="#a21caf">판단 캐시</text>
  <text x="137" y="656" font-size="11.5" fill="#a21caf">(재현성 보장)</text>

  <!-- 코어 → 브로커 -->
  <line x1="425" y1="835" x2="425" y2="894" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="955" y1="835" x2="955" y2="894" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- 브로커 → 저장소 (체결 기록) -->
  <path d="M240,936 L40,936 L40,396 L84,396" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ahs)"/>
  <text x="48" y="560" font-size="11.5" fill="#64748b">체결 기록</text>
  <path d="M1140,936 L1330,936 L1330,396 L1306,396" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ahs)"/>
  <text x="1244" y="560" font-size="11.5" fill="#64748b">체결 기록</text>

  <!-- 텔레그램 ↔ 실전 루프 -->
  <line x1="476" y1="555" x2="539" y2="555" stroke="#475569" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ahb)"/>

  <!-- KIS 브로커 → KIS API 주석 -->
  <text x="425" y="990" font-size="11.5" fill="#b91c1c" text-anchor="middle">↑ KIS OpenAPI 주문 전송</text>
</svg>
