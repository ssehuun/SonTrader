[project]
name = "sontrader"
version = "0.1.0"
description = "Korean stock trading bot built on the Korea Investment & Securities (KIS) open API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
sontrader = "sontrader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sontrader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# docs/는 설계 문서 보관용이다. 지금은 md/svg뿐이라 ruff가 어차피 무시하지만,
# 나중에 예제 .py를 넣더라도 원문 그대로 두기 위해 미리 제외해 둔다.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
